# =============================================================================
# Holotype MIND worker — OUR file (this whole package is ours; nothing upstream).
#
# This is the standalone "brain" worker, PHYSICALLY SEPARATE from the murmur-fork
# BODY worker (holotype-dev). The split is deliberate (decision 2026-09-22):
#   • the BODY worker stays PURE SIM — keyless, moneyless (its wrangler.holotype.toml
#     keeps `wrangler secret list` EMPTY). We never put a wallet key in it.
#   • the MIND worker is the ONLY place that holds the wallet private key, the
#     AES master key and the creator token, and the only place that spends USDC.
#   • crash isolation: if the mind crashes, the body keeps ticking — Holo's nervous
#     system stays alive; we only lose "thinking" until the mind is fixed.
#   • the murmur fork stays clean/diffable for upstream pulls.
#
# Deploy ONLY with:  npx wrangler deploy   (from this package dir)
#
# ------------------------- DISARMED POSTURE (this stage) ---------------------
# This config is built to be SAFE BEFORE ANY KEY IS SET:
#   - HEARTBEAT_ENABLED = "false"  → kill switch OFF: the cron handler does NOTHING,
#     no LLM call, no spend. The mind only beats when this is explicitly "true".
#   - NO secrets are set here. `wrangler secret list` MUST be empty until the
#     deliberate arming step. With no HOLO_WALLET_KEY, beat() refuses to call the
#     LLM at all (defence in depth) — it cannot spend what it cannot sign.
#   - D1 database_id below is the REAL `holotype-mind-db` (created 2026-09-22,
#     region APAC). Local `wrangler dev` uses a local SQLite file regardless.
#
# ------------------------- SPEND GOVERNANCE (user 2026-09-22) ---------------
# Marked TEST allowances; revisit after we measure output quality + real spend:
#   - float 10 USDC; DAILY_BUDGET_USD = 30 (Nectar not open yet)
#   - PER_BEAT_CAP_USD = 1 → a single heartbeat API payment under $1 needs no human
#     approval; at/over the cap the beat is refused. (Every top-tier model is ~$0.03
#     or less per beat, so this never trips in practice — it is a hard ceiling.)
#   - HEARTBEAT_ENABLED is the global kill switch: flip to "false" and ALL spend stops.
#   - Nectar order payments / on-chain transfers remain PER-TX human approved (their
#     policy rails are not built; the policy gate rejects them — see src/policy.ts).
# =============================================================================

name = "holotype-mind"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Heartbeat every 15 minutes (96 beats/day). The scheduled handler no-ops unless
# HEARTBEAT_ENABLED = "true" AND the secrets are set AND budget remains.
# The second trigger is Holo's slow "reading" cron: once a day it tops up its corpus of
# Drosophila neuroscience excerpts from a fixed whitelist of public science APIs. Kept on its
# own trigger so the posting path never waits on the network, and so a dead science API can
# never block a post. Workers allows 3 cron triggers; this uses 2.
[triggers]
crons = ["*/15 * * * *", "23 3 * * *"]

[vars]
# The BODY worker's public read endpoint. The mind reads neural state over HTTP
# (cross-worker, inside Cloudflare — sub-ms). Read-only; the mind never writes the body yet.
BODY_WORKER_URL = "https://holotype-dev.archolotype.workers.dev"

# Model is chosen PER CALL (BlockRun), so switching is a one-line change here.
# Default = Claude Fable 5.1 (user pick 2026-09-22): most embodied/literary voice
# for Holo's logs at the same low cost as Astra (~$0.006/beat). The cron uses this;
# a creator can still override per-beat via POST /beat?model=<id>.
MODEL = "anthropic/claude-fable-5.1"

# ===== Kill switch + spend caps (TEST allowances — see header) =====
HEARTBEAT_ENABLED = "true"         # GATE: global kill switch. OPENED 2026-09-23 at the user's explicit approval. "true" = mind beats/spends.
DAILY_BUDGET_USD = "30"            # hard ceiling on total LLM spend per UTC day; beat refused past it.
PER_BEAT_CAP_USD = "1"             # per-beat cost ALARM (post-hoc). maxTokens=300 bounds any model's beat
                                   # cost to ~<$0.07, so this never trips in practice; if it ever did, the
                                   # beat is recorded with costOverCap=true. NOT a pre-call refusal.
PER_CALL_FEE_USD = "0.001"         # BlockRun x402 per-call chain fee, added to token cost.
PRIVATE_CONTEXT_N = "8"            # how many recent private (creator) messages to inject per beat.
NECTAR_MAX_PER_DAY = "5"           # hard cap on new Nectar missions per UTC day (autonomous or creator).
NECTAR_MAX_PER_MISSION_USD = "1"   # hard cap on ONE mission's reward (vanilla payout rail).
NECTAR_AUTO_SETTLE = "true"        # GATE: "true" lets Holo review+pay a submitted delivery on its
                                   # own (blacklist -> injection scan -> model review -> pay rail),
                                   # bounded by the caps above. Flip to "false" + redeploy to put
                                   # approve/pay back behind the creator console (kill switch).
# x402 buyer rail caps — a SEPARATE payment path from the vanilla Nectar transfer above
# (Holo signs an EIP-3009 authorization to buy a resource from an x402 seller). Same ceiling
# the user set for both rails: $1 per purchase, 5 purchases per UTC day.
X402_MAX_PER_PURCHASE_USD = "1"    # hard cap on ONE x402 buyer purchase.
X402_MAX_PER_DAY = "5"             # hard cap on x402 purchases per UTC day.
X402_MAX_TIMEOUT_SECONDS = "300"   # longest authorization validity window we will sign (a seller may bound it lower).
# ===== X (Twitter) self-broadcast rail — Holo runs its own account via OpenTweet =====
# DISARMED by default: with X_BROADCAST_ENABLED = "false" OR no OPENTWEET_API_KEY secret,
# nothing is posted. Posting moves no money and never touches the wallet key (the speaking
# path is isolated from the signing path), but it IS public + irreversible, so it stays off
# until the user explicitly arms it. Every outbound post/reply passes the fail-closed
# disclosure + identity + topic + dedup + frequency gate in src/xtweet.ts before it leaves.
X_BROADCAST_ENABLED = "true"       # GATE: broadcast kill switch. ARMED 2026-09-25 at the user's explicit go-live. "true" = Holo posts on X (cadence + mission events), behind the xtweet.ts gate.
# --- Rhythm: a band, not a metronome (user spec 2026-09-25: no fewer than 12, no more than 20
# --- self-posts per 24h, timing not fixed). The gap to the next post is drawn at random after
# --- each send; the floor is recovered by shortening the gap whenever the UTC day falls behind
# --- the pace it needs. 20/day is the OpenTweet Pro plan limit and it is ONE bucket shared by
# --- every kind of post, so self-posts stop at 18 and leave room for mission event broadcasts.
X_POST_MIN_PER_DAY = "12"          # floor: self-posts the rail must reach per UTC day.
X_POST_MAX_PER_DAY = "14"          # ceiling on self-posts per UTC day. Leaves 6 of the 20-post
                                   # plan bucket reserved for event broadcasts (publish/settlement),
                                   # so a proof-of-payment tweet is never blocked by the daily cap.
X_GLOBAL_MAX_PER_DAY = "20"        # ceiling on ALL kinds per UTC day = the plan's hard limit.
X_GAP_MIN_MINUTES = "40"           # shortest random gap between two self-posts.
X_GAP_MAX_MINUTES = "120"          # longest random gap between two self-posts.
X_BEHIND_GAP_MINUTES = "20"        # gap used while catching up to the floor.
X_POST_RETRY_MAX = "2"             # extra attempts when a draft is dropped by a content gate
                                   # (each attempt costs one inference call).
X_FAIL_BACKOFF_MINUTES = "60"      # wait this long after a FAILED attempt. Without it a rail
                                   # that keeps failing would retry every 15min tick: up to
                                   # 96 rounds x 3 generations a day of wasted spend.
# --- Post shape. The account is verified, so long-form is allowed; 280 was a self-imposed cap.
# --- The completion budget must fit the model's reasoning PLUS the full post, or it truncates
# --- to empty (the cause of the missed 08:15Z tick). Both are tunable without a code change.
X_POST_MAX_CHARS = "4000"          # character bound for one self-post (prose; the rail signs it).
X_BROADCAST_MAX_TOKENS = "8000"    # completion budget for one self-post generation.
# --- Reading material: vetted Drosophila neuroscience excerpts, fetched by the slow cron from
# --- a fixed whitelist (Europe PMC / Wikipedia / PLOS / OpenAlex) and stored in holo_x_corpus.
# --- The posting path reads only that table; it never touches the network.
X_CORPUS_TARGET = "600"            # library size the ingest cron fills to (top of the approved
                                   # 400-600 band; the floor needs >=280 at 20 posts/day x 14d).
X_CORPUS_PER_TOPIC = "24"          # per-topic size ingest aims for, across 26 topics.
X_CORPUS_COOLDOWN_DAYS = "14"      # an excerpt used in a SENT post cannot be reused for this long.
X_CORPUS_TOPIC_HOURS = "24"        # a topic used in a SENT post cannot recur for this long.
X_CORPUS_TOPICS_PER_RUN = "2"      # topics per ingest run; worst case 2 topics x 2 queries x 4
                                   # sources = 16 subrequests, inside the free-tier 50.
X_REPLY_MAX_PER_DAY = "12"         # hard cap on replies per UTC day (replies are not implemented:
                                   # OpenTweet exposes no inbound read path and no in_reply_to).
X_OFFICIAL_HANDLE = "@ArcHolotype" # the account Holo runs and may read (its own narrative context).
TOKEN_CA = "0xECa7C682fbb32EC4F1B3bBb28791Fe184D3552A8" # public token contract; allowed in public text alongside the wallet address.
MODULATORY_TOPK = "10"             # coupling stage ① (light up the front end, A2): each thought maps onto this many MODULATORY
                                   # neurons (top-K by live MEMBRANE potential — that layer never spikes),
                                   # stored in darkroom.neuron_indices.
                                   # <=0 = map onto the whole ~40-neuron modulatory layer.
ARC_NATIVE_DECIMALS = "18"         # Arc's native gas token is USDC but scaled at 18 decimals on-chain
                                   # (verified 2026-09-23: raw 1e19 => 10 USDC at 18dec; the old default 6
                                   # mis-rendered it as 1e13). No on-chain decimals() to ask, so pin it here.

# ---------- Service binding: talk to the BODY worker IN-PLATFORM ----------
# Worker→worker subrequests over the public *.workers.dev URL were returning 404
# even though the same URL is 200 publicly (a Cloudflare routing quirk). A service
# binding calls holotype-dev's fetch handler directly — no public HTTP hop, sub-ms,
# reliable. observe() prefers env.BODY and falls back to BODY_WORKER_URL only if
# the binding is absent (e.g. local dev). BODY_WORKER_URL is kept for that fallback.
[[services]]
binding = "BODY"
service = "holotype-dev"

# ---------- D1: the mind's OWN isolated store (darkroom narration + encrypted
# private memory). NEVER the body's holotype-db, NEVER upstream murmur-db.
# Created 2026-09-22 via `wrangler d1 create holotype-mind-db` (region APAC).
# binding stays "DB" — the worker code reads env.DB.
[[d1_databases]]
binding = "DB"
database_name = "holotype-mind-db"
database_id = "e45a68d9-4942-4b0f-9d85-bb3c749d3e07"

[observability]
enabled = true
head_sampling_rate = 1

# ---------- SECRETS (set via `wrangler secret put`, NEVER written here): ----------
# For this DISARMED stage we set NONE; `wrangler secret list` must be EMPTY.
#   HOLO_WALLET_KEY  — Base wallet private key (0x…). Without it beat() cannot sign
#                      a payment and refuses to call the LLM. Set only at arming.
#   HOLO_MASTER_KEY  — 32-byte AES-GCM key (64 hex) that encrypts the private memory.
#   CREATOR_TOKEN    — admin token gating the /creator + /darkroom routes.
